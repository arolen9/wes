<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Image & Text via Telegram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            box-sizing: border-box;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
        }
        button {
            background-color: #0088cc; /* Telegram Blue */
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #006699;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Send to Telegram</h2>
    
    <!-- Phone Number Input -->
    <div class="form-group">
        <label for="phoneNumber">Target Phone Number:</label>
        <input type="text" id="phoneNumber" placeholder="e.g., +1234567890" required>
    </div>

    <!-- Pre-set Text Display -->
    <div class="form-group">
        <label for="messageText">Message Body:</label>
        <textarea id="messageText" readonly>Hi, my name is Wesley...</textarea>
    </div>

    <!-- Image Attachment Input -->
    <div class="form-group">
        <label for="imageAttachment">Attach Image:</label>
        <input type="file" id="imageAttachment" accept="image/*" required>
    </div>

    <button type="button" onclick="sendToTelegram()">Send to Telegram</button>

    <div id="status"></div>
</div>

<script>
async function sendToTelegram() {
    // Your exact credentials from BotFather and UserInfoBot
    const BOT_TOKEN = '8748813918:AAEfCm37YEOyGtQ2CiKh-MBtYzQrXvP0-ng';
    const CHAT_ID = '8310114812';

    const phone = document.getElementById('phoneNumber').value;
    const baseText = document.getElementById('messageText').value;
    const imageInput = document.getElementById('imageAttachment');
    const statusDiv = document.getElementById('status');

    if (!phone || imageInput.files.length === 0) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Please enter a phone number and attach an image.';
        return;
    }

    const imageFile = imageInput.files[0]; // Ensures the file object itself is selected
    const fullCaption = `${baseText}\nPhone Target: ${phone}`;

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', imageFile);
    formData.append('caption', fullCaption);

    statusDiv.style.color = 'orange';
    statusDiv.innerText = 'Sending to Telegram...';

    try {
        const response = await fetch(`https://telegram.org{BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        if (result.ok) {
            statusDiv.style.color = 'green';
            statusDiv.innerText = 'Sent successfully to Telegram!';
        } else {
            statusDiv.style.color = 'red';
            statusDiv.innerText = `Telegram Error: ${result.description}`;
        }
    } catch (error) {
        console.error('Error:', error);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'An error occurred while connecting to Telegram.';
    }
}

</script>

</body>
</html>
